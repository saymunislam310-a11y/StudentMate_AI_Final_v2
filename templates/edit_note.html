<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Note • StudentMate AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="app-shell"><header class="topbar"><div><p class="small-label">YOUR KNOWLEDGE</p><h2>Edit Note</h2></div><a href="{{ url_for('profile') }}" class="avatar">S</a></header><main class="page-content"><section class="form-card"><h2>Edit Note</h2><form method="POST"><label>Title</label><input type="text" name="title" value="{{ note['title'] }}" required><label>Subject</label><input type="text" name="subject" value="{{ note['subject'] or '' }}"><label>Content</label><textarea name="content" rows="9">{{ note['content'] }}</textarea><button class="btn btn-primary full">Save Changes</button><a class="item-action" href="{{ url_for('notes') }}" style="margin-top:10px;width:100%;">Cancel</a></form></section></main><nav class="bottom-nav"><a href="{{ url_for('home') }}"><span>⌂</span><small>Home</small></a><a href="{{ url_for('study') }}"><span>📚</span><small>Study</small></a><a href="{{ url_for('routine') }}"><span>⏰</span><small>Routine</small></a><a href="{{ url_for('ai_helper') }}"><span>🤖</span><small>AI</small></a><a href="{{ url_for('profile') }}"><span>👤</span><small>Profile</small></a></nav><script src="{{ url_for('static', filename='js/theme.js') }}"></script></div></body></html>
