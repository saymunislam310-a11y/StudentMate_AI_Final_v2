<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Exam • StudentMate AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="app-shell"><header class="topbar"><div><p class="small-label">STAY PREPARED</p><h2>Edit Exam</h2></div><a href="{{ url_for('profile') }}" class="avatar">S</a></header><main class="page-content"><section class="form-card"><h2>Edit Exam</h2><form method="POST"><label>Subject</label><input type="text" name="subject" value="{{ exam['subject'] }}" required><label>Exam Name</label><input type="text" name="exam_name" value="{{ exam['exam_name'] or '' }}"><label>Exam Date</label><input type="date" name="exam_date" value="{{ exam['exam_date'] }}" required><button class="btn btn-primary full">Save Changes</button><a class="item-action" href="{{ url_for('exams') }}" style="margin-top:10px;width:100%;">Cancel</a></form></section></main><nav class="bottom-nav"><a href="{{ url_for('home') }}"><span>⌂</span><small>Home</small></a><a href="{{ url_for('study') }}"><span>📚</span><small>Study</small></a><a href="{{ url_for('routine') }}"><span>⏰</span><small>Routine</small></a><a href="{{ url_for('ai_helper') }}"><span>🤖</span><small>AI</small></a><a href="{{ url_for('profile') }}"><span>👤</span><small>Profile</small></a></nav><script src="{{ url_for('static', filename='js/theme.js') }}"></script></div></body></html>
